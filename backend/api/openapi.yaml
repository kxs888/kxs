openapi: 3.0.3
info:
  title: CGA API (Slice 0)
  version: 0.0.0
  description: |
    切片 0 框架可运行骨架。统一信封与 `respond.OK` / `respond.Err` 一致。
    成功：`ok/code/message/data/meta`；失败另含 `error`（code/message/trace_id）。
    `meta.request_id` 与 `meta.trace_id` 必有。未实现领域禁止假装 CRUD。
servers:
  - url: http://localhost:8080
tags:
  - name: health
  - name: auth
  - name: ping-writes
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Meta:
      type: object
      required: [request_id, trace_id]
      properties:
        request_id:
          type: string
        trace_id:
          type: string
          description: 与 X-Trace-Id / Traceparent 对应
    ErrorObject:
      type: object
      required: [code, message, trace_id]
      properties:
        code:
          type: string
          description: COMMON_* / AUTH_* / IDEMPOTENCY_* / SM_*
        message:
          type: string
        trace_id:
          type: string
    Envelope:
      type: object
      required: [ok, code, message, data, meta]
      properties:
        ok:
          type: boolean
        code:
          type: string
        message:
          type: string
        data: {}
        error:
          $ref: "#/components/schemas/ErrorObject"
        meta:
          $ref: "#/components/schemas/Meta"
    SuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            ok:
              enum: [true]
            code:
              enum: [OK]
    ErrorEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          required: [error, meta]
          properties:
            ok:
              enum: [false]
            data:
              nullable: true
              description: 失败时恒为 null
            error:
              $ref: "#/components/schemas/ErrorObject"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: demo
        password:
          type: string
          example: demo-pass-change-me
    LoginData:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: 短 TTL 秒数（默认 900）
    MeData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
    PingWriteRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          maxLength: 256
    PingWriteData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
        created_at:
          type: string
          format: date-time
    HealthData:
      type: object
      properties:
        status:
          type: string
          example: ok
    ReadyData:
      type: object
      properties:
        status:
          type: string
          example: ready
        db:
          type: string
          example: ok
paths:
  /healthz:
    get:
      tags: [health]
      summary: 存活探针（明文，永不国密）
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
              example:
                ok: true
                code: OK
                message: ok
                data:
                  status: ok
                meta:
                  request_id: "116b22a61e080c30e88dfbeed31ac53a"
                  trace_id: "a1b2c3d4e5f6789012345678abcdef01"
  /readyz:
    get:
      tags: [health]
      summary: 就绪探针，ping PostgreSQL（明文，永不国密）
      responses:
        "200":
          description: ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
              example:
                ok: true
                code: OK
                message: ok
                data:
                  status: ready
                  db: ok
                meta:
                  request_id: "..."
                  trace_id: "..."
        "503":
          description: database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                ok: false
                code: COMMON_UNAVAILABLE
                message: database unreachable
                data: null
                error:
                  code: COMMON_UNAVAILABLE
                  message: database unreachable
                  trace_id: "..."
                meta:
                  request_id: "..."
                  trace_id: "..."
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 登录占位（argon2id + JWT access 短 TTL）。演示账号 demo / demo-pass-change-me。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 成功信封，data 为 LoginData
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/LoginData"
        "401":
          description: AUTH_INVALID_CREDENTIALS（service 显式 audit auth.login_failed）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                ok: false
                code: AUTH_INVALID_CREDENTIALS
                message: invalid username or password
                data: null
                error:
                  code: AUTH_INVALID_CREDENTIALS
                  message: invalid username or password
                  trace_id: "..."
                meta:
                  request_id: "..."
                  trace_id: "..."
  /api/v1/me:
    get:
      tags: [auth]
      security: [{bearerAuth: []}]
      summary: 当前主体（路由局部 Auth，非全局中间件）
      responses:
        "200":
          description: me
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/MeData"
        "401":
          description: AUTH_UNAUTHORIZED / AUTH_TOKEN_*
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                ok: false
                code: AUTH_UNAUTHORIZED
                message: missing authorization
                data: null
                error:
                  code: AUTH_UNAUTHORIZED
                  message: missing authorization
                  trace_id: "..."
                meta:
                  request_id: "..."
                  trace_id: "..."
  /api/v1/ping-writes:
    post:
      tags: [ping-writes]
      security: [{bearerAuth: []}]
      summary: 幂等写示例。同 Idempotency-Key 双提交回放且只落一行。成功时 service 显式 audit.Record。
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PingWriteRequest"
      responses:
        "201":
          description: 创建或回放
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PingWriteData"
        "400":
          description: IDEMPOTENCY_KEY_REQUIRED / COMMON_INVALID_ARGUMENT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: AUTH_UNAUTHORIZED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: IDEMPOTENCY_KEY_CONFLICT（同 key 不同 body）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                ok: false
                code: IDEMPOTENCY_KEY_CONFLICT
                message: idempotency key reused with different payload
                data: null
                error:
                  code: IDEMPOTENCY_KEY_CONFLICT
                  message: idempotency key reused with different payload
                  trace_id: "..."
                meta:
                  request_id: "..."
                  trace_id: "..."
