services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cga
      POSTGRES_PASSWORD: cga
      POSTGRES_DB: cga
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cga -d cga"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - cga-pg:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ROLE: all
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://cga:cga@postgres:5432/cga?sslmode=disable
      JWT_SECRET: dev-only-change-me-32-chars-min!!
      JWT_TTL: 15m
      LOG_LEVEL: info
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      SM_CRYPTO_ENABLED: "false"
      BOOTSTRAP_USERNAME: demo
      BOOTSTRAP_PASSWORD: demo-pass-change-me
    ports:
      - "8080:8080"

volumes:
  cga-pg:
